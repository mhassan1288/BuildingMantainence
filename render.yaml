databases:
  - name: building-maintenance-db
    databaseName: maintenance
    user: maintenance
    plan: free
services:
  - type: web
    name: building-maintenance-api
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    preDeployCommand: npm run migrate:backend && npm run seed:backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: building-maintenance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
